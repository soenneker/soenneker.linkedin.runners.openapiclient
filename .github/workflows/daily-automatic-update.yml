name: daily-automatic-update
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

env:
  ASPNETCORE_ENVIRONMENT: Production
  GH__USERNAME: ${{ secrets.GH__USERNAME }}
  GH__TOKEN: ${{ secrets.GH__TOKEN }}
  GIT__TOKEN: ${{ secrets.GIT__TOKEN }}
  GIT__NAME: ${{ secrets.GIT__NAME }}
  GIT__EMAIL: ${{ secrets.GIT__EMAIL }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  daily-automatic-update:
    runs-on: ubuntu-latest
  
    steps:
      - uses: actions/checkout@v7

      - name: Setting up build version
        run: |
          version=$(($GITHUB_RUN_NUMBER))
          echo "BUILD_VERSION=11.0.$version" >> ${GITHUB_ENV}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.100-rc.3.26522.148

      - name: Restore
        run: dotnet restore src/Soenneker.LinkedIn.Runners.OpenApiClient/Soenneker.LinkedIn.Runners.OpenApiClient.csproj

      - name: Build
        run: dotnet build src/Soenneker.LinkedIn.Runners.OpenApiClient/Soenneker.LinkedIn.Runners.OpenApiClient.csproj --configuration Release --no-restore

      - name: Restore documentation baseline
        uses: actions/cache/restore@v6
        with:
          path: output/playwright/
          key: linkedin-hybrid-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: linkedin-hybrid-v1-${{ github.ref_name }}-

      - name: Run
        env:
          NUGET__TOKEN: ${{ secrets.NUGET__TOKEN }}
        run: dotnet run --project src/Soenneker.LinkedIn.Runners.OpenApiClient/Soenneker.LinkedIn.Runners.OpenApiClient.csproj --configuration Release --no-restore --no-build --verbosity normal

      - name: Upload documentation and schema changes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linkedin-documentation
          path: output/playwright/
          if-no-files-found: ignore

      - name: Save documentation baseline
        if: always() && hashFiles('output/playwright/documentation/manifest.json') != '' && hashFiles('output/playwright/openapi.json') != ''
        uses: actions/cache/save@v6
        with:
          path: output/playwright/
          key: linkedin-hybrid-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
